openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: ComfyUI Studio API — proxy and orchestration layer for a ComfyUI server
servers:
  - url: /api
    description: Base API path
security:
  - clerkSession: []
tags:
  - name: health
    description: Health operations
  - name: settings
    description: Server configuration
  - name: comfy
    description: ComfyUI server proxy
  - name: modelark
    description: ModelArk provider readiness
  - name: workflows
    description: Workflow templates
  - name: jobs
    description: Generation jobs
  - name: outputs
    description: Generated outputs gallery
  - name: files
    description: File uploads
  - name: assistant
    description: AI chat assistant and video agent

paths:
  /healthz:
    get:
      security: []
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get current server settings
      responses:
        "200":
          description: Settings object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Update server settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsInput"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"

  /comfy/status:
    get:
      operationId: getComfyStatus
      tags: [comfy]
      summary: Check ComfyUI server reachability and system stats
      responses:
        "200":
          description: Server status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComfyStatus"

  /comfy/readiness:
    get:
      operationId: getComfyReadiness
      tags: [comfy]
      summary: Check ComfyUI readiness for the MimicMotion workflow
      responses:
        "200":
          description: MimicMotion provider readiness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComfyReadiness"

  /modelark/status:
    get:
      operationId: getModelArkStatus
      tags: [modelark]
      summary: Check whether ModelArk is configured
      responses:
        "200":
          description: ModelArk configuration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelArkStatus"

  /modelark/models:
    get:
      operationId: getModelArkModels
      tags: [modelark]
      summary: List the ModelArk models supported by Studio
      responses:
        "200":
          description: ModelArk model catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelArkModels"

  /comfy/models:
    get:
      operationId: getComfyModels
      tags: [comfy]
      summary: List available models from ComfyUI server
      responses:
        "200":
          description: Available models grouped by type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComfyModels"

  /comfy/queue:
    get:
      operationId: getComfyQueue
      tags: [comfy]
      summary: Get current ComfyUI queue state
      responses:
        "200":
          description: Queue state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComfyQueue"

  /workflows:
    get:
      operationId: listWorkflows
      tags: [workflows]
      summary: List all available workflow templates
      responses:
        "200":
          description: List of workflow templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkflowTemplate"

  /workflows/{id}:
    get:
      operationId: getWorkflow
      tags: [workflows]
      summary: Get a workflow template with its parameter schema
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Workflow template detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowTemplate"
        "404":
          description: Not found

  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List all generation jobs
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, running, completed, failed, cancelled]
        - name: workflowId
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: number
            default: 50
      responses:
        "200":
          description: List of jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
    post:
      operationId: createJob
      tags: [jobs]
      summary: Submit a new generation job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobInput"
      responses:
        "201":
          description: Created job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          description: Invalid request

  /jobs/stats:
    get:
      operationId: getJobStats
      tags: [jobs]
      summary: Get job statistics for the dashboard
      responses:
        "200":
          description: Job statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStats"

  /batches:
    get:
      operationId: listBatches
      tags: [jobs]
      summary: List viral generation batches with child jobs
      responses:
        "200":
          description: Batches ordered by newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Batch"
    post:
      operationId: createBatch
      tags: [jobs]
      summary: Create a bounded sequence of related video jobs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchInput"
      responses:
        "201":
          description: Batch created and its first child submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Batch"
        "400":
          description: Invalid creative batch setup

  /batches/{id}:
    get:
      operationId: getBatch
      tags: [jobs]
      summary: Get one generation batch and all child jobs
      parameters:
        - $ref: "#/components/parameters/BatchId"
      responses:
        "200":
          description: Batch detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Batch"
        "404":
          description: Not found
    delete:
      operationId: cancelBatch
      tags: [jobs]
      summary: Stop scheduling queued children in a batch
      parameters:
        - $ref: "#/components/parameters/BatchId"
      responses:
        "200":
          description: Cancelled batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Batch"

  /batches/{id}/refresh:
    post:
      operationId: refreshBatch
      tags: [jobs]
      summary: Refresh active children and submit the next bounded child
      parameters:
        - $ref: "#/components/parameters/BatchId"
      responses:
        "200":
          description: Updated batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Batch"

  /batches/{id}/children/{jobId}/retry:
    post:
      operationId: retryBatchChild
      tags: [jobs]
      summary: Retry a failed child with its original controlled variation
      parameters:
        - $ref: "#/components/parameters/BatchId"
        - name: jobId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Updated batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Batch"

  /jobs/{id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get a job by ID including status and output
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Job detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: Not found
    delete:
      operationId: deleteJob
      tags: [jobs]
      summary: Cancel or delete a job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /jobs/{id}/refresh:
    post:
      operationId: refreshJob
      tags: [jobs]
      summary: Poll ComfyUI for updated status of a running job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Updated job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: Not found

  /outputs:
    get:
      operationId: listOutputs
      tags: [outputs]
      summary: List all generated output files (gallery)
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [image, video, audio]
        - name: limit
          in: query
          schema:
            type: number
            default: 50
      responses:
        "200":
          description: List of outputs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Output"

  /outputs/recent:
    get:
      operationId: getRecentOutputs
      tags: [outputs]
      summary: Get the most recent outputs for the dashboard
      responses:
        "200":
          description: Recent outputs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Output"

  /model-assignments:
    get:
      operationId: getModelAssignments
      tags: [settings]
      summary: Get per-workflow model assignments and fallbacks
      responses:
        "200":
          description: Model assignments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelAssignments"
    put:
      operationId: updateModelAssignments
      tags: [settings]
      summary: Save per-workflow model assignments and fallbacks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelAssignmentsInput"
      responses:
        "200":
          description: Updated model assignments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelAssignments"
        "400":
          description: Invalid request

  /settings/gpus:
    post:
      operationId: addSavedGpu
      tags: [settings]
      summary: Save a GPU endpoint URL under a label for one-click switching
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedGpuInput"
      responses:
        "201":
          description: Saved GPU endpoint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedGpu"
        "400":
          description: Invalid request

  /settings/gpus/{id}:
    delete:
      operationId: deleteSavedGpu
      tags: [settings]
      summary: Remove a saved GPU endpoint
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
        "404":
          description: Not found

  /comfy/validate-nodes:
    post:
      operationId: validateComfyNodes
      tags: [comfy]
      summary: Check which node class_types in a workflow JSON are missing on the ComfyUI server
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateNodesInput"
      responses:
        "200":
          description: Validation result (non-blocking — informational only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeValidation"
        "400":
          description: Invalid request

  /saved-workflows:
    get:
      operationId: listSavedWorkflows
      tags: [saved-workflows]
      summary: List user-saved custom workflows
      responses:
        "200":
          description: Saved workflows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedWorkflow"
    post:
      operationId: createSavedWorkflow
      tags: [saved-workflows]
      summary: Save a custom workflow by name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedWorkflowInput"
      responses:
        "201":
          description: Saved workflow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedWorkflow"
        "400":
          description: Invalid request

  /saved-workflows/{id}:
    delete:
      operationId: deleteSavedWorkflow
      tags: [saved-workflows]
      summary: Delete a saved workflow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
        "404":
          description: Not found

  /files/upload:
    post:
      operationId: uploadFile
      tags: [files]
      summary: Upload a file and forward it to ComfyUI
      parameters:
        - name: accept
          in: query
          required: false
          schema:
            type: string
          description: >-
            Optional comma-separated list of allowed file types for this upload,
            in HTML accept format (MIME types like image/png, wildcards like
            image/*, or extensions like .png). Files that don't match are
            rejected with 422.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The file to upload (image, audio, or video)
      responses:
        "200":
          description: Uploaded file reference returned by ComfyUI
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadedFile"
        "400":
          description: No file provided or parse error
        "413":
          description: File too large (limit is 100 MB)
        "415":
          description: File is not a recognized image, audio, or video
        "429":
          description: Upload concurrency or daily quota exceeded
        "503":
          description: Upload quota storage unavailable
        "422":
          description: File type not allowed by the accept filter
        "502":
          description: ComfyUI upstream unreachable or returned an error

  /files/import-output:
    post:
      operationId: importOutput
      tags: [files]
      summary: Copy a generated ComfyUI output into the input directory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportOutputInput"
      responses:
        "200":
          description: Imported input file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadedFile"
        "400":
          description: Invalid output reference
        "502":
          description: ComfyUI could not be reached

  /assistant/chat:
    post:
      operationId: assistantChat
      tags: [assistant]
      summary: Chat with the ComfyUI Studio assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantChatBody"
      responses:
        "200":
          description: Assistant reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantChatResponse"
        "502":
          description: AI provider error

  /assistant/video-plan:
    post:
      operationId: assistantVideoPlan
      tags: [assistant]
      summary: Turn a video idea into a ready-to-run workflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoPlanBody"
      responses:
        "200":
          description: Chosen template and filled workflow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoPlanResponse"
        "502":
          description: AI provider error

components:
  securitySchemes:
    clerkSession:
      type: apiKey
      in: cookie
      name: __session
      description: Clerk browser session cookie. Sign in through the web client before calling protected endpoints.
  parameters:
    BatchId:
      name: id
      in: path
      required: true
      schema:
        type: number
  schemas:
    AssistantChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          maxLength: 8000

    AssistantChatBody:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          maxItems: 40
          items:
            $ref: "#/components/schemas/AssistantChatMessage"
        workflowJson:
          type: string
          maxLength: 100000
          description: Optional workflow JSON the user is currently editing, for context
        model:
          type: string
          maxLength: 120
          description: Optional hosted text model ID. studio-openai keeps the existing assistant provider.

    AssistantChatResponse:
      type: object
      required: [reply]
      properties:
        reply:
          type: string

    VideoPlanBody:
      type: object
      required: [idea]
      properties:
        idea:
          type: string
          minLength: 1
          maxLength: 4000
          description: Plain-language description of the video the user wants

    VideoPlanResponse:
      type: object
      required: [templateId, workflowJson, notes]
      properties:
        templateId:
          type: string
          description: One of the built-in template ids
        workflowJson:
          type: string
          description: The filled-in workflow JSON, ready to queue
        notes:
          type: string
          description: Plain-language explanation of choices and anything the user must do (e.g. upload files)

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    Settings:
      type: object
      required: [comfyUrl, updatedAt, savedGpus, routingMode, selectedGpuId]
      properties:
        comfyUrl:
          type: string
          description: URL of the ComfyUI server (e.g. http://localhost:8188)
        updatedAt:
          type: string
          format: date-time
        savedGpus:
          type: array
          items:
            $ref: "#/components/schemas/SavedGpu"
        routingMode:
          type: string
          enum: [auto, manual]
        selectedGpuId:
          type: ["number", "null"]

    SavedGpu:
      type: object
      required: [id, label, url]
      properties:
        id:
          type: number
        label:
          type: string
        url:
          type: string

    SavedGpuInput:
      type: object
      required: [label, url]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 50
        url:
          type: string
          minLength: 1

    SettingsInput:
      type: object
      required: [comfyUrl]
      properties:
        comfyUrl:
          type: string
        routingMode:
          type: string
          enum: [auto, manual]
        selectedGpuId:
          type: ["number", "null"]

    ComfyStatus:
      type: object
      required: [connected]
      properties:
        connected:
          type: boolean
        serverUrl:
          type: ["string", "null"]
        gpuName:
          type: ["string", "null"]
        gpuVram:
          type: ["string", "null"]
        ramUsed:
          type: ["string", "null"]
        ramTotal:
          type: ["string", "null"]
        queueRemaining:
          type: ["number", "null"]
        error:
          type: ["string", "null"]
        workers:
          type: array
          items:
            type: object
            required: [id, label, connected, queueRemaining, selected]
            properties:
              id:
                type: number
              label:
                type: string
              connected:
                type: boolean
              queueRemaining:
                type: number
              gpuName:
                type: ["string", "null"]
              error:
                type: ["string", "null"]
              selected:
                type: boolean

    ComfyReadiness:
      type: object
      required: [ready, workers]
      properties:
        ready:
          type: boolean
        workers:
          type: array
          items:
            type: object
            required: [id, label, connected, compatible, queueRemaining, selected]
            properties:
              id:
                type: number
              label:
                type: string
              connected:
                type: boolean
              compatible:
                type: boolean
              queueRemaining:
                type: number
              gpuName:
                type: ["string", "null"]
              missingNodes:
                type: array
                items:
                  type: string
              error:
                type: ["string", "null"]
              selected:
                type: boolean

    ModelArkStatus:
      type: object
      required: [configured, model, textModel, imageModel, models]
      properties:
        configured:
          type: boolean
        model:
          type: ["string", "null"]
        textModel:
          type: ["string", "null"]
        imageModel:
          type: ["string", "null"]
        models:
          type: array
          items:
            $ref: "#/components/schemas/ModelArkModel"

    ModelArkModels:
      type: object
      required: [configured, models, defaults]
      properties:
        configured:
          type: boolean
        models:
          type: array
          items:
            $ref: "#/components/schemas/ModelArkModel"
        defaults:
          type: object
          required: [text, image, video]
          properties:
            text:
              type: ["string", "null"]
            image:
              type: ["string", "null"]
            video:
              type: ["string", "null"]

    ModelArkModel:
      type: object
      required: [id, name, capability, description, hosted]
      properties:
        id:
          type: string
        name:
          type: string
        capability:
          type: string
          enum: [text, image, video]
        description:
          type: string
        hosted:
          type: boolean

    ComfyModels:
      type: object
      required: [checkpoints, loras, vaes, controlnets]
      properties:
        checkpoints:
          type: array
          items:
            type: string
        loras:
          type: array
          items:
            type: string
        vaes:
          type: array
          items:
            type: string
        controlnets:
          type: array
          items:
            type: string

    ComfyQueue:
      type: object
      required: [queueRunning, queuePending]
      properties:
        queueRunning:
          type: number
        queuePending:
          type: number
        runningItems:
          type: array
          items:
            type: object
            additionalProperties: true

    WorkflowParam:
      type: object
      required: [key, label, type]
      properties:
        key:
          type: string
        label:
          type: string
        type:
          type: string
          enum: [text, number, file, select, slider]
        description:
          type: ["string", "null"]
        required:
          type: boolean
        defaultValue:
          type: ["string", "null"]
        options:
          type: ["array", "null"]
          items:
            type: string
        min:
          type: ["number", "null"]
        max:
          type: ["number", "null"]
        accept:
          type: ["string", "null"]
          description: File accept string e.g. image/*,video/*,audio/*

    WorkflowTemplate:
      type: object
      required: [id, name, description, category, params]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          type: string
          enum:
            [
              lip-sync,
              motion-control,
              video-generation,
              image-generation,
              cinematic,
              content-creation,
              seedance-style,
              perform-anywhere,
              custom,
            ]
        icon:
          type: ["string", "null"]
        estimatedTime:
          type: ["string", "null"]
        params:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowParam"

    Job:
      type: object
      required:
        [
          id,
          workflowId,
          workflowName,
          status,
          params,
          workerId,
          workerLabel,
          createdAt,
        ]
      properties:
        id:
          type: number
        workflowId:
          type: string
        workflowName:
          type: string
        status:
          type: string
          enum: [pending, running, completed, failed, cancelled]
        params:
          type: object
          additionalProperties: true
        workerId:
          type: ["number", "null"]
        workerLabel:
          type: ["string", "null"]
        comfyPromptId:
          type: ["string", "null"]
        progress:
          type: ["number", "null"]
          description: 0-100
        errorMessage:
          type: ["string", "null"]
        outputs:
          type: array
          items:
            $ref: "#/components/schemas/Output"
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: ["string", "null"]
          format: date-time
        batchId:
          type: ["number", "null"]
        batchIndex:
          type: ["number", "null"]

    Batch:
      type: object
      required:
        [
          id,
          name,
          batchType,
          status,
          totalJobs,
          completedJobs,
          failedJobs,
          cancelledJobs,
          settings,
          children,
          createdAt,
        ]
      properties:
        id:
          type: number
        name:
          type: string
        batchType:
          type: string
          enum:
            [scene-variation, finished-video-variation, perform-anywhere-angles]
        status:
          type: string
          enum: [pending, running, completed, failed, cancelled]
        totalJobs:
          type: number
        completedJobs:
          type: number
        failedJobs:
          type: number
        cancelledJobs:
          type: number
        settings:
          type: object
          additionalProperties: true
        children:
          type: array
          items:
            $ref: "#/components/schemas/Job"
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: ["string", "null"]
          format: date-time

    BatchInput:
      type: object
      required:
        [
          name,
          batchType,
          batchSize,
          masterAsset,
          scenePrompt,
          styleAnchor,
          seedStrategy,
        ]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        batchType:
          type: string
          enum:
            [scene-variation, finished-video-variation, perform-anywhere-angles]
        batchSize:
          type: number
          minimum: 1
          maximum: 30
        masterAsset:
          type: string
          description: Uploaded image for scenes or uploaded video for finished-video variations
        scenePrompt:
          type: string
          minLength: 2
          maxLength: 1000
        styleAnchor:
          type: string
          minLength: 2
          maxLength: 1000
        identityAnchor:
          type: string
        outfitAsset:
          type: string
        locationAsset:
          type: string
        poseAsset:
          type: string
        propAsset:
          type: string
        cameraTreatments:
          type: array
          items:
            type: string
        aspectRatios:
          type: array
          items:
            type: string
        colorGrades:
          type: array
          items:
            type: string
        captionTreatment:
          type: string
        seedStrategy:
          type: string
          enum: [incremental, fixed, random]
        baseSeed:
          type: number
        durationSeconds:
          type: number
          minimum: 1
          maximum: 60

    JobInput:
      type: object
      required: [workflowId, params]
      properties:
        workflowId:
          type: string
        params:
          type: object
          additionalProperties: true
        workerId:
          type: ["number", "null"]
          description: Optional saved GPU id override. Omit to use Settings routing.

    ImportOutputInput:
      type: object
      required: [filename, jobId]
      properties:
        filename:
          type: string
          minLength: 1
        jobId:
          type: number
          minimum: 1
          description: Owned completed job containing the output.
        subfolder:
          type: string
        type:
          type: string
          enum: [output]

    JobStats:
      type: object
      required: [total, pending, running, completed, failed, todayCount]
      properties:
        total:
          type: number
        pending:
          type: number
        running:
          type: number
        completed:
          type: number
        failed:
          type: number
        todayCount:
          type: number

    Output:
      type: object
      required:
        [id, jobId, filename, subfolder, outputType, comfyUrl, createdAt]
      properties:
        id:
          type: number
        jobId:
          type: number
        filename:
          type: string
        subfolder:
          type: string
        outputType:
          type: string
          enum: [image, video, audio]
        comfyUrl:
          type: string
          description: Proxied URL to fetch the file from ComfyUI
        thumbnailUrl:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    WorkflowModelAssignment:
      type: object
      properties:
        checkpoint:
          type: string
          description: Primary checkpoint model name
        checkpointFallback:
          type: string
          description: Fallback checkpoint model name if primary is unavailable

    ModelAssignments:
      type: object
      required: [global, workflows]
      properties:
        global:
          $ref: "#/components/schemas/WorkflowModelAssignment"
        workflows:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/WorkflowModelAssignment"

    ModelAssignmentsInput:
      type: object
      required: [global, workflows]
      properties:
        global:
          $ref: "#/components/schemas/WorkflowModelAssignment"
        workflows:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/WorkflowModelAssignment"

    ValidateNodesInput:
      type: object
      required: [json]
      properties:
        json:
          type: string
          description: ComfyUI API-format workflow JSON as a string

    NodeValidation:
      type: object
      required: [reachable, missingNodes, totalNodes]
      properties:
        reachable:
          type: boolean
          description: Whether the ComfyUI server could be queried for its node list
        missingNodes:
          type: array
          items:
            type: string
          description: class_type values referenced in the workflow but not installed on the server
        totalNodes:
          type: number
          description: Number of distinct class_types referenced by the workflow

    SavedWorkflow:
      type: object
      required: [id, name, json, createdAt]
      properties:
        id:
          type: number
        name:
          type: string
        json:
          type: string
          description: The ComfyUI API-format workflow JSON as a string
        createdAt:
          type: string

    SavedWorkflowInput:
      type: object
      required: [name, json]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        json:
          type: string
          minLength: 2

    UploadedFile:
      type: object
      required: [name, subfolder, type]
      properties:
        name:
          type: string
        subfolder:
          type: string
        type:
          type: string
